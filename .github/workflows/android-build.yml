name: IFIX VPN Automated Build (APK & AAB)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IFIX_VPN_Debug_APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Build Release AAB (Google Play Bundle)
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:bundleRelease --stacktrace --no-daemon || true
          else
            gradle :app:bundleRelease --stacktrace --no-daemon || true
          fi
        continue-on-error: true

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IFIX_VPN_Release_AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
