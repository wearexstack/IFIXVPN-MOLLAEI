name: IFIX VPN Automated Build (APK & AAB)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IFIX_VPN_Debug_APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release AAB (Google Play Bundle)
        run: gradle :app:bundleRelease --stacktrace || true

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IFIX_VPN_Release_AAB
          path: app/build/outputs/bundle/release/app-release.aab
